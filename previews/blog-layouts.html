<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dee’s Blog Layout Previews</title><style>*{box-sizing:border-box}body{margin:0;background:#090705;color:#f4e8d5;font-family:Arial,sans-serif}header{padding:24px 5%;text-align:center}h1{font-size:25px;margin:0 0 10px}p{color:#cabbab;font-size:15px;line-height:1.5}nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}button{border:1px solid #76613e;background:transparent;color:#f4e8d5;padding:13px 17px;border-radius:8px;font-size:15px;cursor:pointer}button[aria-pressed=true]{background:#cf0f59;border-color:#cf0f59;color:white}main{max-width:1100px;margin:auto}figure{margin:0}figcaption{text-align:center;padding:10px 20px 20px;color:#e6c17e}img{display:block;width:100%;height:auto}figure[hidden]{display:none}a{color:#ff86b5}</style></head><body><header><h1>Choose your blog layout</h1><p>Tap an option below to see it. These are design previews of your opening paragraphs.</p><nav aria-label="Layout options"><button type="button" aria-pressed="true" data-layout="journal">1. Personal journal</button><button type="button" aria-pressed="false" data-layout="magazine">2. Magazine style</button><button type="button" aria-pressed="false" data-layout="minimal">3. Minimal</button></nav></header><main><figure data-preview="journal"><figcaption>Personal journal: warm typography and a subtle butterfly.</figcaption><img src="blog-journal.png" alt="Personal journal layout preview with a cream and pink title and a small butterfly"></figure><figure data-preview="magazine" hidden><figcaption>Magazine style: a warm photo behind the title.</figcaption><img src="blog-magazine.png" alt="Magazine layout preview with a candlelit photograph behind the blog title"></figure><figure data-preview="minimal" hidden><figcaption>Minimal: simple typography with the focus on your words.</figcaption><img src="blog-minimal.png" alt="Minimal layout preview with simple cream typography on a dark background"></figure></main><script>document.querySelectorAll('[data-layout]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-layout]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.querySelectorAll('[data-preview]').forEach(item=>item.hidden=item.dataset.preview!==button.dataset.layout)}));</script></body></html>
